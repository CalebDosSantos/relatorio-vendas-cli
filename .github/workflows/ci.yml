name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e '.[dev]'
      - run: ruff check src tests
      - run: ruff format --check src tests
      - run: mypy src
      - run: pytest

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t relatorio-vendas-cli .
      - name: Smoke test
        run: |
          docker run --rm relatorio-vendas-cli /app/examples/vendas_exemplo.csv | grep "R\$ 599,30"
          docker run --rm -v "$PWD/examples:/data" relatorio-vendas-cli vendas_com_data.csv -f json \
            --start 2025-01-01 --end 2025-03-31 | grep '"valor_total": 818.8'
